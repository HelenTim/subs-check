name: 自动运行当前项目把测速结果存放到gist里

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

# 发布结果到 output 分支需要写权限
permissions:
  contents: write

jobs:
  run-subs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Resolve and merge sub-urls
        env:
          MYNODES: ${{ secrets.MYNODES }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          set -e
          > resolved-urls.txt

          > all-nodes.txt

          # 1) 仓库中的 myNode.md
          if [ -s myNode.md ]; then
            echo "读取仓库中的 myNode.md，共 $(grep -c . myNode.md || true) 行非空内容"
            cat myNode.md >> all-nodes.txt
          else
            echo "仓库中无 myNode.md 或为空"
          fi

          # 2) MYNODES secret 指定的 Gist 链接
          if [ -n "$MYNODES" ]; then
            MYNODES="${MYNODES//[[:space:]]/}"
            echo "从 Gist 获取节点列表"
            case "$MYNODES" in
              *gist.github.com/*)
                # gist 页面链接，通过 API 换取内容
                gist_id=$(printf '%s' "$MYNODES" | sed -E 's|[?#].*$||; s|.*/||')
                curl -sL --max-time 30 \
                  ${GIST_TOKEN:+-H "Authorization: Bearer $GIST_TOKEN"} \
                  "https://api.github.com/gists/$gist_id" -o gist-api.json || true
                # 逐文件统计非空行数：空文件或>1MB被截断的文件，API返回content=null，join时会静默丢失
                jq -r '.files | to_entries[] | "    文件[\(.key)] 非空行数: \(.value.content // "" | split("\n") | map(select(length>0)) | length)"' gist-api.json 2>/dev/null || true
                jq -r '[.files[]?.content // empty] | join("\n")' gist-api.json > mynodes-gist.md || true
                ;;
              *)
                # raw 链接，直接拉取
                curl -sL --max-time 30 "$MYNODES" > mynodes-gist.md || true
                ;;
            esac
            if [ -s mynodes-gist.md ]; then
              echo "  已获取，共 $(grep -c . mynodes-gist.md || true) 行非空内容，逐行核对："
              awk '{ n++; if ($0 ~ /^[ \t\r]*$/) printf "    第%d行: 空行\n", n; else if ($0 ~ /^#/) printf "    第%d行: 注释行\n", n; else printf "    第%d行: 链接（%.24s…）\n", n, $0 }' mynodes-gist.md
              cat mynodes-gist.md >> all-nodes.txt
            else
              echo "  Gist 获取失败，跳过（检查链接有效性或 GIST_TOKEN 权限）"
            fi
          else
            echo "MYNODES secret 未配置或为空，跳过该节点来源"
          fi

          if [ ! -s all-nodes.txt ]; then
            echo "myNode.md 与 MYNODES 均未提供任何链接，仅使用 config.yaml 中原有的 sub-urls"
          fi

          # 逐行处理（myNode.md 与 Gist 的链接已合并在 all-nodes.txt 中）
          # 统一去掉 Windows 换行符，防止链接尾部带 \r
          tr -d '\r' < all-nodes.txt > all-nodes.tmp && mv all-nodes.tmp all-nodes.txt
          total_lines=$(grep -c . all-nodes.txt || true)
          skipped_comment=0
          n=0
          while IFS= read -r url; do
            # 跳过空行和以 # 开头的注释行
            if [ -z "$url" ]; then continue; fi
            case "$url" in \#*)
              skipped_comment=$((skipped_comment+1))
              # 注释行里可能带链接，先掩码前缀再打印
              echo "::add-mask::${url:0:30}"
              echo "跳过注释行（前30字符）: ${url:0:30}"
              continue ;;
            esac

            n=$((n+1))
            # 不在日志中打印具体链接，防止泄露
            echo "::add-mask::$url"
            echo "处理第 $n 个链接"

            content=$(curl -sL --max-time 30 "$url" || true)

            if [ -z "$content" ]; then
              echo "  拉取失败，跳过"
              continue
            fi

            # 判断返回的是节点内容还是地址列表
            # 2>/dev/null：大内容时 grep -q 匹配后提前退出，echo 会报 Broken pipe，纯噪音无影响
            if echo "$content" 2>/dev/null | grep -qE '^(ss|vmess|vless|trojan|hysteria|hysteria2|tuic)://' \
               || echo "$content" 2>/dev/null | grep -qE '^\s*proxies:'; then
              echo "  节点内容，保留原链接"
              echo "$url" >> resolved-urls.txt
            elif echo "$content" 2>/dev/null | grep -qE '^https?://'; then
              echo "  地址列表，展开子链接"
              echo "$content" | grep -E '^https?://' | tr -d '\r' >> resolved-urls.txt
            else
              echo "  无法判断格式，保留原链接"
              echo "$url" >> resolved-urls.txt
            fi
          done < all-nodes.txt

          echo "行数统计: 输入非空 $total_lines 行 = 处理链接 $n 个 + 注释跳过 $skipped_comment 行"

          # 合并 config.yaml 里原有的 sub-urls
          yq eval '.sub-urls[]' config/config.yaml 2>/dev/null >> resolved-urls.txt || true

          # 去重、过滤空行
          grep -vE '^\s*$' resolved-urls.txt | sort -u > final-urls.txt

          echo "最终链接数:"
          wc -l < final-urls.txt

          # 生成 sub-urls 块
          {
            echo "sub-urls:"
            while IFS= read -r u; do
              [ -n "$u" ] && printf '  - "%s"\n' "$u"
            done < final-urls.txt
          } > sub-urls-block.yaml

          # 替换 config.yaml 的 sub-urls
          yq eval 'del(.sub-urls)' config/config.yaml > config-base.yaml
          yq eval-all 'select(fileIndex==0) *+ select(fileIndex==1)' config-base.yaml sub-urls-block.yaml > config/config.yaml

          echo "===== 最终合并的 sub-urls（共 $(yq '.sub-urls // [] | length' config/config.yaml) 条）====="
          # 注意：仓库和 Action 日志都是公开的；secret/myNode 来源的顶层链接此前已 add-mask，会显示为 ***
          yq '.sub-urls[]' config/config.yaml
          echo "===== sub-urls 明细结束 ====="

      - name: Build image from local code
        run: |
          # 不用上游镜像 ghcr.io/beck-8/subs-check:latest（它没有环境变量兜底逻辑），
          # 直接用当前仓库代码构建，确保 gist 的 env 回退生效
          docker build \
            --build-arg GITHUB_SHA=${{ github.sha }} \
            --build-arg VERSION=${{ github.ref_name }} \
            -t subs-check:local .

      - name: Run subs-check container
        continue-on-error: true
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          # gist 配置优先读 config.yaml，未配置时程序自动回退到环境变量
          # GIST_TOKEN / GIST_ID（来自 Repository secrets），token 无需写入仓库
          # 只打印是否配置，不打印值
          if [ -n "$GIST_TOKEN" ]; then echo "GIST_TOKEN 已配置"; else echo "⚠️ GIST_TOKEN 未配置"; fi
          if [ -n "$GIST_ID" ]; then echo "GIST_ID 已配置"; else echo "⚠️ GIST_ID 未配置"; fi
          timeout -k 60 5400 docker run --rm \
            -e GIST_TOKEN -e GIST_ID \
            -v ${{ github.workspace }}/config:/app/config \
            -v ${{ github.workspace }}/output:/app/output \
            subs-check:local

      - name: Publish results to output branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 把 output/ 全量发布到独立的 output 分支（每次单提交覆盖推送，不累积历史）
          # 查看位置: 仓库分支切换到 output；文件 raw 地址:
          # https://raw.githubusercontent.com/${{ github.repository }}/output/all.yaml
          if [ -z "$(ls -A output 2>/dev/null)" ]; then
            echo "output 目录为空，跳过发布"
            exit 0
          fi
          cd output
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "节点检测结果 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
          echo "已发布 $(ls -1 | wc -l) 个文件到 output 分支"

      - name: Upload all-node snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-node
          path: output/all-node.txt
          if-no-files-found: ignore
          retention-days: 3
